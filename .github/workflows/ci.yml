name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests experiments examples benchmarks
          ruff format --check src tests experiments examples benchmarks
      - name: Unit tests
        run: pytest
      - name: Doctests
        run: pytest --doctest-modules src -q

  min-versions:
    # the oldest dependency versions pyproject.toml allows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lowest direct dependencies
        run: |
          python -m pip install uv
          uv pip install --system --resolution lowest-direct -e . pytest
      - name: Unit tests
        run: pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and check the distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

  examples-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned experiment environment
        run: python -m pip install -e ".[lightgbm]" -r requirements-experiments.txt
      - name: Examples
        run: |
          python examples/01_quickstart.py
          python examples/02_small_minority_pitfall.py
          python examples/03_real_data_pipeline.py
          python examples/04_fraud_table.py
      - name: Benchmarks (quick)
        run: python benchmarks/bench_package.py --quick
      - name: Experiment smoke run (quick profiles)
        working-directory: experiments
        run: |
          python e1_first_split.py --quick
          python e2_sweep.py --quick
          python e4_mitigations.py --quick
