[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowselect"
version = "0.1.0"
description = "Shadow-feature selection with diagnostics for class imbalance (minority-count aware)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dan Avraham" }]
keywords = ["feature selection", "boruta", "shadow features", "class imbalance", "gradient boosting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.23", "scipy>=1.9", "scikit-learn>=1.2"]

[project.optional-dependencies]
xgboost = ["xgboost>=1.7"]
lightgbm = ["lightgbm>=3.3"]
experiments = ["xgboost==2.1.3", "pandas>=2.0", "matplotlib>=3.7", "pyyaml>=6.0", "joblib>=1.3"]
dev = ["pytest>=7", "ruff>=0.4", "xgboost>=1.7", "lightgbm>=3.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
